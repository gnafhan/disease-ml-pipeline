# Konfigurasi terkunci untuk seluruh pipeline.
# JANGAN di-hardcode ulang di file lain — semua stage baca dari sini.
# Kalau perlu ubah (misal ganti seed), ubah SEKALI di sini, lalu re-run semua eksperimen.

seed: 42

split:
  train: 0.70
  val: 0.15
  test: 0.15
  strategy: stratified

# 12 kelas final — dipakai untuk MENYARING semua versi data (data-v1/v2/v3),
# bukan cuma data-v3. Ini yang bikin lintas versi bisa dibandingkan.
classes:
  - "Pneumonia/ISPA"
  - "Suspek Dengue"
  - "COVID-19 Konfirmasi"
  - "Diare Akut"
  - "Acute Flaccid Paralysis"
  - "Sindrom Jaundice Akut"
  - "Suspek HFMD"
  - "Suspek Tetanus"
  - "GHPR"
  - "Suspek Leptospirosis"
  - "Diare Berdarah"
  - "Suspek Meningitis/Ensefalitis"

# kelas dengan sampel training di bawah ini ditandai reliable=False saat evaluasi,
# BUKAN dihapus diam-diam
min_support_reliable: 30

paths:
  raw_rsud_nas_rawat_jalan: "raw_data/RSUD NAS DATA/RAWAT JALAN"
  raw_rsud_nas_rawat_inap: "raw_data/RSUD NAS DATA/RAWAT INAP"
  raw_rsa_ugm: "raw_data/RS Akademik UGM/Penelitian Wawa 1 Labeled.xlsx"
  icd_skdr_mapping: "raw_data/RS Akademik UGM/ICD SKDR versi 30 Desember 2024 (1).xlsx"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

# dua versi model, dipilih lewat argumen CLI di src/train.py — bukan file terpisah
models:
  base:
    hf_name: "indolem/indobert-base-uncased"
  large:
    hf_name: "indobenchmark/indobert-large-p1"

training:
  max_len: 192
  batch_size: 8
  grad_accum: 2
  lr: 1.0e-5
  epochs: 12
  early_stopping_patience: 4
  focal_gamma: 2.0
  label_smoothing: 0.1
  weight_decay: 0.05
  hidden_dropout: 0.15
  classifier_dropout: 0.3

metrics:
  # SELALU dihitung di test set untuk headline. val_* dicatat terpisah,
  # tidak pernah dipakai sebagai angka utama.
  primary: "macro_f1_reliable_only"
  secondary:
    - "macro_f1_all"
    - "weighted_f1"
    - "accuracy"
